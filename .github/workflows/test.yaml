on: ["push", "pull_request"]


env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CAIRO_VERSION: v2.6.3

name: Test

concurrency:
  # Cancel older, in-progress jobs from the same PR, same workflow.
  # use run_id if the job is triggered by a push to ensure
  # push-triggered jobs to not get canceled.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
    linting:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v3

        - name: Setup Python
          uses: actions/setup-python@v4
          with:
              python-version: "3.10"

        - name: Install Dependencies
          run: |
            python -m pip install --upgrade pip
            pip install .[lint]

        - name: Run Black
          run: black --check .

        - name: Run isort
          run: isort --check-only .

        - name: Run flake8
          run: flake8 .

        - name: Run mdformat
          run: mdformat . --check

    functional:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]   # eventually add `windows-latest`
                python-version: [3.8, 3.9, "3.10", "3.11"]

        steps:
        - uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
              python-version: ${{ matrix.python-version }}

        - name: rustup toolchain install
          uses: dtolnay/rust-toolchain@stable
          with:
            components: rustfmt
      
        - name: Setup Scarb
          uses: software-mansion/setup-scarb@v1.3.2
          with:
            scarb-version: "latest"

        - name: Clone Cairo
          run: |
            git clone https://github.com/starkware-libs/cairo.git tests/cairo
            pushd tests/cairo
            git fetch --tags
            git checkout ${{ env.CAIRO_VERSION }}
            cargo run --bin starknet-compile --manifest-path Cargo.toml -- --version
            cargo run --bin starknet-sierra-compile --manifest-path Cargo.toml -- --version
            popd

        - name: Install Dependencies
          run: |
            python -m pip install --upgrade pip
            pip install .[test]

        - name: Run Tests
          run: pytest -m "not fuzzing" -n 0 -s --cov
